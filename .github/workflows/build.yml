name: Build Caddy Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build.yml

  schedule:
    - cron: '0 23 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: caddy-cloudflare-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Cloudflare version
        id: cloudflare
        shell: bash
        run: |
          VERSION=$(curl -fsSL \
            https://proxy.golang.org/github.com/caddy-dns/cloudflare/@latest \
            | jq -r '.Version')

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Could not determine Cloudflare version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Cloudflare version: $VERSION"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Caddy image digests
        id: caddy
        shell: bash
        run: |
          BUILDER_DIGEST=$(docker buildx imagetools inspect \
            caddy:builder | awk '/^Digest:/ {print $2; exit}')

          RUNTIME_DIGEST=$(docker buildx imagetools inspect \
            caddy:latest | awk '/^Digest:/ {print $2; exit}')

          if [[ -z "$BUILDER_DIGEST" || -z "$RUNTIME_DIGEST" ]]; then
            echo "Could not determine Caddy image digests"
            exit 1
          fi

          echo "builder=$BUILDER_DIGEST" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME_DIGEST" >> "$GITHUB_OUTPUT"

          echo "Builder: $BUILDER_DIGEST"
          echo "Runtime: $RUNTIME_DIGEST"

      - name: Lowercase repository owner
        id: lowercase
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if build is needed
        id: check
        env:
          OWNER: ${{ steps.lowercase.outputs.owner }}
          BUILDER_DIGEST: ${{ steps.caddy.outputs.builder }}
          RUNTIME_DIGEST: ${{ steps.caddy.outputs.runtime }}
          CLOUDFLARE_VERSION: ${{ steps.cloudflare.outputs.version }}
          FORCE: ${{ github.event_name == 'push' || inputs.force }}
        shell: bash
        run: |
          BUILDER_SHORT="${BUILDER_DIGEST#sha256:}"
          RUNTIME_SHORT="${RUNTIME_DIGEST#sha256:}"

          BUILDER_SHORT="${BUILDER_SHORT:0:12}"
          RUNTIME_SHORT="${RUNTIME_SHORT:0:12}"

          VERSION_TAG="ghcr.io/${OWNER}/caddy-cloudflare:b${BUILDER_SHORT}-r${RUNTIME_SHORT}-cf-${CLOUDFLARE_VERSION}"

          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

          if [[ "$FORCE" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Forced rebuild requested."

          elif docker buildx imagetools inspect "$VERSION_TAG" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Everything is up to date. Skipping build."

          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "New version combination detected."
          fi

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          build-args: |
            CADDY_BUILDER_IMAGE=caddy:builder@${{ steps.caddy.outputs.builder }}
            CADDY_RUNTIME_IMAGE=caddy:latest@${{ steps.caddy.outputs.runtime }}
            CLOUDFLARE_VERSION=${{ steps.cloudflare.outputs.version }}

          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/caddy-cloudflare:latest
            ${{ steps.check.outputs.version_tag }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
